<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="20" y="20" width="472" height="472" rx="95" fill="none"
        stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Letter E (serif style) -->
  <text x="165" y="355"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="290"
        font-weight="bold"
        fill="white"
        opacity="1">E</text>

  <!-- Open book icon (bottom-right of E) -->
  <!-- Left page -->
  <path d="M270 295 Q256 280 242 295 L242 350 Q256 338 270 350 Z"
        fill="white" opacity="0.95"/>
  <!-- Right page -->
  <path d="M270 295 Q284 280 298 295 L298 350 Q284 338 270 350 Z"
        fill="white" opacity="0.95"/>
  <!-- Book spine line -->
  <line x1="270" y1="295" x2="270" y2="350" stroke="rgba(91,33,182,0.4)" stroke-width="2"/>

  <!-- Sound waves -->
  <path d="M308 308 Q320 322 308 336"
        fill="none" stroke="white" stroke-width="9"
        stroke-linecap="round" opacity="0.9"/>
  <path d="M322 298 Q342 322 322 346"
        fill="none" stroke="white" stroke-width="8"
        stroke-linecap="round" opacity="0.7"/>
  <path d="M336 288 Q364 322 336 356"
        fill="none" stroke="white" stroke-width="7"
        stroke-linecap="round" opacity="0.45"/>
</svg>
