# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: english-record
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    # SPA Routing: Redirect all routes to index.html for React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Asset caching headers
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # Environment Variables to be configured in Render Dashboard
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_S3_ENDPOINT
        sync: false
      - key: VITE_S3_REGION
        sync: false
      - key: VITE_S3_ACCESS_KEY_ID
        sync: false
      - key: VITE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: VITE_S3_BUCKET_NAME
        sync: false
      - key: VITE_R2_PUBLIC_URL
        sync: false
      - key: VITE_AI_API_KEY
        sync: false
